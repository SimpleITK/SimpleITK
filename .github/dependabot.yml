version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "release"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      pre-commit:
        patterns:
          - "*"
    # Ignore these hooks, updates require widespread code style changes.
    ignore:
      - dependency-name: "https://github.com/pre-commit/mirrors-clang-format"
      - dependency-name: "https://github.com/BlankSpruce/gersemi-pre-commit"
