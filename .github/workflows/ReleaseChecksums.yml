name: Release checksum tests

on:
  push:
    branches: [ master, main, release ]
    paths:
      - .github/workflows/Package.yml
      - .github/workflows/ReleaseChecksums.yml
      - Utilities/Maintenance/PrepareReleaseAssets.py
      - Utilities/Maintenance/tests/test_prepare_release_assets.py
  pull_request:
    branches: [ master, main, release ]
    paths:
      - .github/workflows/Package.yml
      - .github/workflows/ReleaseChecksums.yml
      - Utilities/Maintenance/PrepareReleaseAssets.py
      - Utilities/Maintenance/tests/test_prepare_release_assets.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Test release asset preparation
        run: python -m unittest discover -s Utilities/Maintenance/tests -p test_prepare_release_assets.py -v
