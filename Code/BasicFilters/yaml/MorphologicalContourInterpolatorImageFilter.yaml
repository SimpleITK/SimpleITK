briefdescription: Interpolates contours between slices.
detaileddescription: >-
  \par Inputs and Outputs
  This is an image-to-image filter. The dimensionality is 3D or higher. Input contains an image with some slices segmented,
  usually manually. The output has all in-between slices also segmented.


  \par Parameters
  Slices are detected at positions where a pixel exists with same labeled neighbors in slice and only clear (0) neighbors
  perpendicular to the slice.


  Filter can be restricted to run along only one axis, and/or to interpolate just one label.


  Since optimal alignment between slices would require exhaustive search, the default is to use heuristic (breadth first search
  starting from centroid).


  There is also an alternative algorithm based on distance transform approach. It is slightly faster, but it can jump across
  a twisty shape (not geodesic).


  Reference: Albu AB, Beugeling T, Laurendeau D. "A morphology-based approach for interslice interpolation of anatomical slices
  from volumetric images." IEEE Trans Biomed Eng. 2008 Aug;55(8):2022-38. DOI:10.1109/TBME.2008.921158


  Acknowledgement: This work is supported by NIH grant R01 EB014346, "Continued development and maintenance of the ITK-SNAP
  3D image segmentation software."
