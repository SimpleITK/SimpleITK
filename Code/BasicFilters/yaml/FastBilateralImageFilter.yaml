briefdescription: A fast approximation to the bilateral filter.
detaileddescription: >-
  This filter is a fast approximation to the bilateral filter. Blurring is performed on an image based on the distance of pixels
  in both space and intensity.


  The algorithm used was originally proposed by Paris and Durand [1].


  Instead of calculating a kernel for every pixel in an image, this filter places the values of each pixel into a higher dimensional
  image determined by the position and intensity of a pixel. How many bins are used is determined by the sigma values provided
  to the filter. Larger sigmas will result in more aggressive downsampling and less running time overall. After the data of an
  image has been organized into bins, a DiscreteGaussianImageFilter is applied. Finally, the output image is constructed by
  interpolating the values of the output pixels from the blurred higher dimensional image.


  [1] Sylvain Paris and Fredo Durand, A Fast Approximation of the Bilateral Filter using a Signal Processing Approach, European
  Conference on Computer Vision (ECCV'06)


