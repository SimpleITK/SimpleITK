briefdescription: Applies a variance filter to an image.
detaileddescription: >-
  Computes an image where a given pixel is the sample variance of the pixels in a neighborhood about the corresponding input
  pixel.


  A variance filter is a nonlinear (quadratic) neighborhood filter.


  \see MeanImageFilter



  \see NoiseImageFilter
